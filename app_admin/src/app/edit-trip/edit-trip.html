<div class="container mt-4" style="max-width: 600px;">
  <h2>Edit Trip</h2>
  <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Code</label>
      <input type="text" formControlName="code" class="form-control" readonly />
    </div>
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" formControlName="name" class="form-control" />
    </div>
    <div class="mb-3">
      <label class="form-label">Length</label>
      <input type="text" formControlName="length" class="form-control" />
    </div>
    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input type="text" formControlName="start" class="form-control" />
    </div>
    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input type="text" formControlName="resort" class="form-control" />
    </div>
    <div class="mb-3">
      <label class="form-label">Per Person</label>
      <input type="text" formControlName="perPerson" class="form-control" />
    </div>
    <div class="mb-3">
      <label class="form-label">Image Filename</label>
      <input type="text" formControlName="image" class="form-control" />
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea formControlName="description" class="form-control" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-success me-2">Update Trip</button>
    <a routerLink="/" class="btn btn-secondary">Cancel</a>
  </form>
</div>
